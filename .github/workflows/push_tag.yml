name: 'Publish CI'
on:
    push:
        tags:
            - 'v*.*.*'
            - 'v*.*.*-rc.*'
            - 'v0.0.0-*'

env:
    NODE_ENV: 'production'

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            package_name: ${{ steps.pack.outputs.package_name }}
            tgz_filename: ${{ steps.pack.outputs.tgz_filename }}
            is_snapshot: ${{ steps.pack.outputs.is_snapshot }}
            version: ${{ steps.pack.outputs.version }}
        steps:
            - name: Cancel Previous Runs
              uses: styfle/cancel-workflow-action@0.9.1
              with:
                  access_token: ${{ github.token }}

            - name: Checkout cplace-asc
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Get tag
              id: tag
              uses: dawidd6/action-get-tag@v1

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.15.0'
                  registry-url: 'https://registry.npmjs.org'

            - name: Cache Node Modules
              id: npm-cache
              uses: actions/cache@v4
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Install modules
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Build and Pack
              id: pack
              run: |
                  npx ts-node tools/scripts/build-and-pack.ts
              env:
                  TAG: ${{ steps.tag.outputs.tag }}

            - name: Upload package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: npm-package
                  path: dist/${{ steps.pack.outputs.tgz_filename }}
                  retention-days: 1

    publish:
        name: Trusted Publish to NPM
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download package artifact
              uses: actions/download-artifact@v4
              with:
                  name: npm-package

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - name: Publish to npm
              run: |
                  PACKAGE_NAME="${{ needs.build.outputs.package_name }}"
                  TGZ_FILE="${{ needs.build.outputs.tgz_filename }}"
                  IS_SNAPSHOT="${{ needs.build.outputs.is_snapshot }}"
                  VERSION="${{ needs.build.outputs.version }}"
                  LATEST=$(npm view "${PACKAGE_NAME}" version 2>/dev/null || echo "0.0.0")

                  if [ "${IS_SNAPSHOT}" = "true" ]; then
                      TAG="snapshot"
                  elif npx semver "$VERSION" -r "<=$LATEST"; then
                      TAG="release-$(echo "$VERSION" | cut -d. -f1,2)"
                  else
                      TAG="latest"
                  fi

                  echo "Publishing ${TGZ_FILE} with tag ${TAG}"
                  npm publish "${TGZ_FILE}" --tag "${TAG}"
